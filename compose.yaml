services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    ports:
      - "14330:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

  db-init:
    # O sqlcmd18 já vem incluído na imagem Linux do SQL Server 2022.
    image: mcr.microsoft.com/mssql/server:2022-latest
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Defina MSSQL_SA_PASSWORD no arquivo .env}"
    volumes:
      - ./sql:/scripts:ro
    entrypoint: ["/opt/mssql-tools18/bin/sqlcmd"]
    command:
      - -S
      - db
      - -U
      - sa
      - -P
      - "${MSSQL_SA_PASSWORD}"
      - -C
      - -i
      - /scripts/criar_banco.sql

  app:
    build:
      context: .
      dockerfile: Dockerfile
    profiles: ["desktop"]
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      SQLSERVER_DB_URL: "jdbc:sqlserver://db:1433;databaseName=CadastroClientes;encrypt=true;trustServerCertificate=true"
      SQLSERVER_DB_USUARIO: sa
      SQLSERVER_DB_SENHA: "${MSSQL_SA_PASSWORD}"
      DISPLAY: "${DISPLAY:-host.docker.internal:0.0}"
    stdin_open: true
    tty: true

volumes:
  sqlserver_data:
