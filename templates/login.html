{{define "content"}}
<div class="panel">
    <h1>Acesso ao Cadastro de Clientes</h1>
    {{if .HasUsers}}
        <p>Informe suas credenciais para acessar o sistema.</p>
    {{else}}
        <p>Primeiro acesso: crie o administrador do sistema.</p>
    {{end}}
    <form method="post">
        <label>Login</label>
        <input name="login" autofocus>
        <label>Senha</label>
        <input type="password" name="senha">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:10px">
            <button class="btn">Entrar</button>
            <a href="/sair" style="color:#ef4444;text-decoration:none;font-size:13px" onclick="return confirm('Deseja realmente encerrar a aplicação e fechar todos os terminais?');">Encerrar aplicação</a>
        </div>
    </form>
</div>
{{end}}
